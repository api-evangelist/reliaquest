aid: reliaquest
name: ReliaQuest
description: >-
  ReliaQuest is a Tampa-based, privately held cybersecurity company whose GreyMatter platform
  runs agentic AI security operations (detection, containment, investigation and response) on top
  of the security tools a customer already owns, connected through bidirectional APIs to 300+
  technologies. Customers automate GreyMatter through the GreyMatter API, a single-endpoint GraphQL
  API (incidents, cases, tasks, detections, playbooks, DRP alerts, discover tasks, users, access
  groups and API keys) documented as a public Postman collection at apidocs.myreliaquest.com and
  authenticated with an X-API-KEY header. ReliaQuest also operates the Digital Shadows SearchLight
  Portal API (digital risk protection) acquired with Digital Shadows in 2022, whose reference is
  customer-only.
