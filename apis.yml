apis:
- aid: reliaquest:greymatter-api
  name: GreyMatter API
  description: >-
    The GreyMatter API exposes select GreyMatter capabilities through a single GraphQL endpoint.
    All requests are HTTPS POSTs with JSON bodies authenticated by an X-API-KEY header; 58 queries
    and 95 mutations cover incidents, cases, tasks, detections and change control, playbooks and
    playbook runs, DRP alerts and access-control policies, discover tasks, assets, identities,
    indicators, reference lists, emergency contacts, AI context memory, users, roles, pods, access
    groups and API keys. Paginated queries follow the Relay GraphQL Connections standard and
    entities are addressed by base64 Global IDs. Rate limited to 5,000 tokens per user per hour.
    Introspection is available to authenticated callers; the published contract is a Postman
    collection served by ReliaQuest at apidocs.myreliaquest.com.
  image: https://resources.reliaquest.com/image/upload/c_limit,w_1024,h_1024,f_webp,q_auto/v1725562607/reliaquest-author-logo.jpg
  humanURL: https://apidocs.myreliaquest.com/
  baseURL: https://greymatter.myreliaquest.com/graphql
