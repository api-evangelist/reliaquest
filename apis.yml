- aid: reliaquest:searchlight-portal-api
  name: Digital Shadows SearchLight Portal API
  description: >-
    REST API of the Digital Shadows SearchLight digital-risk-protection portal, operated by
    ReliaQuest since its 2022 acquisition of Digital Shadows (unauthenticated calls return a JSON
    error that names drpsupport@reliaquest.com). Authenticated with HTTP Basic credentials (an API
    key id and secret) and the vendor media type application/vnd.polaris-v38+json; resources
    include data breaches, data-breach usernames, DNS lookups, domain and IP WHOIS, search,
    intel threats, incidents and intel incidents. The API reference lives inside the portal behind
    a customer login, so no machine-readable contract is publicly reachable; the endpoint set here
    is read from ReliaQuest's own shadowline client on GitHub.
  image: https://resources.reliaquest.com/image/upload/c_limit,w_1024,h_1024,f_webp,q_auto/v1725562607/reliaquest-author-logo.jpg
  humanURL: https://portal-digitalshadows.com/learn/searchlight-api/overview
  baseURL: https://portal-digitalshadows.com/api/
  tags:
  - Digital Risk Protection
  - Threat Intelligence
  - Data Breach
  - WHOIS
  properties:
  - type: SourceCode
    url: https://github.com/digitalshadows/shadowline-api
  - type: CLI
    url: cli/reliaquest-cli.yml
  - type: StatusPage
    url: https://status.digitalshadows.com/
  - type: Authentication
    url: authentication/reliaquest-authentication.yml
